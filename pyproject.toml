[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-platform"
version = "1.0.0"
description = "Production-oriented credit risk prediction platform"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "joblib",
    "numpy",
    "pandas",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
